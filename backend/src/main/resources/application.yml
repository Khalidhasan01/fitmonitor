spring:
  application:
    name: fitmonitor-backend

  profiles:
    default: dev

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    # No default here: every profile must supply a secret of at least 32 characters
    # (prod reads JWT_SECRET) or the application refuses to start.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/fitmonitor
    username: postgres
    password: postgres

  jpa:
    show-sql: true

app:
  jwt:
    # Local development only. Override with JWT_SECRET; never reuse this value elsewhere.
    secret: ${JWT_SECRET:dev-only-secret-not-for-production-use-0123456789}

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    database: h2

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
